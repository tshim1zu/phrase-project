[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "japhrase"
version = "0.3.0"
description = "Pure-math text intelligence engine for Japanese — vocabulary richness, contamination detection, writing habit analysis, character voice fingerprinting"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Takeshi SHIMIZU", email = "shim1zu@hotmail.com"}
]
maintainers = [
    {name = "Takeshi SHIMIZU", email = "shim1zu@hotmail.com"}
]
keywords = [
    "nlp", "japanese", "text-analysis", "stylometry", "contamination-detection",
    "writing-quality", "vocabulary-richness", "phrase-extraction", "japanese-nlp",
    "computational-linguistics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Natural Language :: Japanese",
]
dependencies = [
    "numpy>=1.20.0,<3.0",
    "pandas>=1.3.0,<3.0",
    "scipy>=1.7.0",
    "chardet>=4.0.0",
    "click>=8.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
]
similarity = [
    "python-Levenshtein>=0.12.0",
    "scikit-learn>=0.24.0",
]
network = [
    "networkx>=2.6",
]
excel = [
    "openpyxl>=3.0.0",
]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.0.0",
    "black>=21.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
]
all = [
    "japhrase[viz,similarity,network,excel,dev]",
]

[project.scripts]
japhrase = "japhrase.cli:main"

[project.urls]
Homepage = "https://github.com/tshim1zu/phrase-project"
Repository = "https://github.com/tshim1zu/phrase-project"
Documentation = "https://github.com/tshim1zu/phrase-project#readme"
"Bug Tracker" = "https://github.com/tshim1zu/phrase-project/issues"

[tool.setuptools.packages.find]
include = ["japhrase", "japhrase.*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
japhrase = ["py.typed"]

[tool.build-system]
# Explicit file inclusion to ensure proper wheel packaging
allow-direct-references = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
