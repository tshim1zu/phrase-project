name: "Academic Paper Quality Check"
description: |
  学位論文の品質をチェックするワークフロー
  - フレーズ抽出
  - あらすじと本文の乖離チェック
  - 個人の口癖検出

tasks:
  - id: extract_phrases
    type: extract
    input: body.txt
    output: results/phrases.csv
    params:
      min_count: 5
      max_length: 30
      selection: 1

  - id: check_abstract_divergence
    type: check_divergence
    inputs:
      - abstract.txt
      - body.txt
    output: results/divergence_report.json

  - id: detect_author_habits
    type: detect_habits
    input: body.txt
    depends_on: [extract_phrases]
    output: results/habits.csv
    params:
      z_score_threshold: 2.0
