name: "Novel Manuscript Revision Check"
description: |
  小説原稿の推敲チェックワークフロー
  - 重複フレーズの検出
  - 表現の重複箇所発見

tasks:
  - id: extract_key_phrases
    type: extract
    input: manuscript.txt
    output: results/key_phrases.csv
    params:
      min_count: 3
      max_length: 20
      threshold_originality: 0.6

  - id: detect_redundancy
    type: kwic
    input: manuscript.txt
    depends_on: [extract_key_phrases]
    params:
      phrase: "同じ表現"
      context_lines: 2
