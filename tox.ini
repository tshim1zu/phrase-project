[tox]
envlist = py38,py39,py310,py311,py312,lint,type

[testenv]
deps =
    pytest>=6.0.0
    pytest-cov>=2.0.0
commands =
    pytest {posargs:tests}
    pytest --cov=japhrase --cov-report=term-missing

[testenv:lint]
deps =
    flake8>=3.9.0
    black>=21.0
commands =
    black --check japhrase tests
    flake8 japhrase tests

[testenv:type]
deps =
    mypy>=0.910
commands =
    mypy japhrase

[testenv:format]
deps =
    black>=21.0
commands =
    black japhrase tests

[testenv:build]
deps =
    build
    twine
commands =
    python -m build
    twine check dist/*

skip_missing_interpreters = True

[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv,build,dist
ignore = E203,W503

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
